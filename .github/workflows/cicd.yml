name: FixFlowAI CI/CD

on:
  pull_request:
    branches:
      - testing
      - main
  push:
    branches:
      - testing
      - main
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        default: testing
        type: choice
        options:
          - testing
          - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('fixflowai-ci-pr-{0}', github.event.pull_request.number) || 'fixflowai-shared-aws-deploy' }}
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'us-east-1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AMPLIFY_APP_ID: d22glq95zibf1w
  BACKEND_API_URL: https://d6opkcrsagj0v.cloudfront.net/api
  ECS_CLUSTER: fixflowai-cluster
  ECS_SERVICE: fixflowai-backend-service
  CONTAINER_NAME: fixflowai-backend
  PUPPETEER_SKIP_DOWNLOAD: true
  PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache
  
jobs:
  ci:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      MONGODB_URI: mongodb://localhost:27017/fixflowai-ci
      JWT_SECRET: 1234567890abcdef1234567890abcdef
      JWT_REFRESH_SECRET: abcdef1234567890abcdef1234567890
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
      - name: Harden npm network settings
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund

      - name: Run backend unit tests
        run: npm --prefix backend test

      - name: Build frontend
        run: npm run build

      - name: Validate backend Docker image build
        run: docker build -t fixflowai-backend:ci ./backend

  deploy-backend:
    name: Deploy Backend
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 35
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    # Testing and main currently share one ECS/CloudFront backend, so deploy runs are serialized at workflow level.
    outputs:
      deploy_environment: ${{ steps.deploy-context.outputs.deploy_environment }}
      amplify_branch: ${{ steps.deploy-context.outputs.amplify_branch }}
      image_uri: ${{ steps.image.outputs.image_uri }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve deployment context
        id: deploy-context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.target_environment }}"
            if [ "$DEPLOY_ENV" != "${{ github.ref_name }}" ]; then
              echo "Manual deployments must be run from the branch that matches target_environment." >&2
              echo "Selected target_environment=$DEPLOY_ENV but workflow ref is ${{ github.ref_name }}." >&2
              exit 1
            fi
          elif [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_ENV="main"
          else
            DEPLOY_ENV="testing"
          fi

          if [ "$DEPLOY_ENV" = "main" ]; then
            IMAGE_TAG="latest"
            FRONTEND_URL="https://main.${{ env.AMPLIFY_APP_ID }}.amplifyapp.com"
          else
            IMAGE_TAG="testing"
            FRONTEND_URL="https://testing.${{ env.AMPLIFY_APP_ID }}.amplifyapp.com"
          fi

          echo "deploy_environment=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "amplify_branch=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"

      - name: Resolve AWS auth method
        id: aws-auth
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS credentials are missing
        if: steps.aws-auth.outputs.method == 'none'
        run: |
          echo "Missing AWS credentials. Set AWS_ROLE_ARN for OIDC or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        if: steps.aws-auth.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (Access Keys)
        if: steps.aws-auth.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Sync hosted frontend and OAuth callback URLs to SSM
        run: |
          aws ssm put-parameter \
            --name "/proplytics/dev/FRONTEND_URL" \
            --type String \
            --value "${{ steps.deploy-context.outputs.frontend_url }}" \
            --overwrite \
            --region "${{ env.AWS_REGION }}"

          aws ssm put-parameter \
            --name "/proplytics/dev/GITHUB_CALLBACK_URL" \
            --type String \
            --value "${{ env.BACKEND_API_URL }}/auth/github/callback" \
            --overwrite \
            --region "${{ env.AWS_REGION }}"

      - name: Build and push backend image
        id: image
        run: |
          IMAGE_URI="${{ secrets.ECR_REPOSITORY }}:${{ github.sha }}"
          MOVING_IMAGE_URI="${{ secrets.ECR_REPOSITORY }}:${{ steps.deploy-context.outputs.image_tag }}"

          docker build -t "$IMAGE_URI" -t "$MOVING_IMAGE_URI" ./backend
          docker push "$IMAGE_URI"
          docker push "$MOVING_IMAGE_URI"

          echo "image_uri=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Register ECS task definition revision
        id: task-definition
        run: |
          jq \
            --arg image "${{ steps.image.outputs.image_uri }}" \
            --arg container "${{ env.CONTAINER_NAME }}" \
            '.containerDefinitions |= map(if .name == $container then .image = $image else . end)' \
            backend/task-definition.json > task-definition.rendered.json

          TASK_DEFINITION_ARN=$(aws ecs register-task-definition \
            --cli-input-json file://task-definition.rendered.json \
            --region "${{ env.AWS_REGION }}" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          echo "task_definition_arn=$TASK_DEFINITION_ARN" >> "$GITHUB_OUTPUT"

      - name: Update ECS service
        run: |
          aws ecs update-service \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --service "${{ env.ECS_SERVICE }}" \
            --task-definition "${{ steps.task-definition.outputs.task_definition_arn }}" \
            --force-new-deployment \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for ECS service stability
        run: |
          aws ecs wait services-stable \
            --cluster "${{ env.ECS_CLUSTER }}" \
            --services "${{ env.ECS_SERVICE }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Verify backend health through CloudFront
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent --show-error "${{ env.BACKEND_API_URL }}/health"; then
              exit 0
            fi
            echo "Backend health check failed on attempt $attempt; retrying..."
            sleep 10
          done

          echo "Backend health check did not pass after retries." >&2
          exit 1

  deploy-frontend:
    name: Deploy Frontend
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    env:
      VITE_API_URL: https://d6opkcrsagj0v.cloudfront.net/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Harden npm network settings
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund

      - name: Build frontend
        run: npm run build

      - name: Resolve AWS auth method
        id: aws-auth
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS credentials are missing
        if: steps.aws-auth.outputs.method == 'none'
        run: |
          echo "Missing AWS credentials. Set AWS_ROLE_ARN for OIDC or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        if: steps.aws-auth.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (Access Keys)
        if: steps.aws-auth.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Amplify branch environment variables
        run: |
          aws amplify update-branch \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ needs.deploy-backend.outputs.amplify_branch }}" \
            --environment-variables "VITE_API_URL=${{ env.BACKEND_API_URL }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Package build output
        run: |
          cd dist
          zip -r ../deploy.zip .

      - name: Create Amplify deployment
        id: amplify
        run: |
          read -r JOB_ID UPLOAD_URL <<< "$(aws amplify create-deployment \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ needs.deploy-backend.outputs.amplify_branch }}" \
            --region "${{ env.AWS_REGION }}" \
            --query '[jobId,zipUploadUrl]' \
            --output text)"

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to Amplify
        run: |
          curl -X PUT \
            --upload-file deploy.zip \
            -H "Content-Type: application/zip" \
            "${{ steps.amplify.outputs.upload_url }}"

      - name: Start Amplify deployment
        run: |
          aws amplify start-deployment \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ needs.deploy-backend.outputs.amplify_branch }}" \
            --job-id "${{ steps.amplify.outputs.job_id }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for Amplify deployment
        run: |
          for attempt in {1..90}; do
            STATUS=$(aws amplify get-job \
              --app-id "${{ env.AMPLIFY_APP_ID }}" \
              --branch-name "${{ needs.deploy-backend.outputs.amplify_branch }}" \
              --job-id "${{ steps.amplify.outputs.job_id }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'job.summary.status' \
              --output text)

            echo "Amplify job status: $STATUS"

            if [ "$STATUS" = "SUCCEED" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Amplify deployment." >&2
          exit 1
