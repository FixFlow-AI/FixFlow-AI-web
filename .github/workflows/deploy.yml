name: FixFlowAI CD Deploy

on:
  # push:
  #   branches:
  #     - main
  #     - testing
  workflow_dispatch:
    inputs:
      target_environment:
        description: Environment to deploy
        required: true
        default: testing
        type: choice
        options:
          - testing
          - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: fixflowai-shared-aws-deploy
  cancel-in-progress: false

env:
  NODE_VERSION: 20
  AWS_REGION: ${{ vars.AWS_REGION || secrets.AWS_REGION || 'ap-south-1' }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AMPLIFY_APP_ID: d22glq95zibf1w
  BACKEND_API_URL: https://d6opkcrsagj0v.cloudfront.net/api
  PUPPETEER_SKIP_DOWNLOAD: true
  PUPPETEER_CACHE_DIR: /tmp/puppeteer-cache

jobs:
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_API_URL: https://d6opkcrsagj0v.cloudfront.net/api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Harden npm network settings
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-mintimeout 20000
          npm config set fetch-retry-maxtimeout 120000
          
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Resolve deployment context
        id: deploy-context
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            DEPLOY_ENV="${{ inputs.target_environment }}"
            if [ "$DEPLOY_ENV" != "${{ github.ref_name }}" ]; then
              echo "Manual deployments must be run from the branch that matches target_environment." >&2
              echo "Selected target_environment=$DEPLOY_ENV but workflow ref is ${{ github.ref_name }}." >&2
              exit 1
            fi
          elif [ "${{ github.ref_name }}" = "main" ]; then
            DEPLOY_ENV="main"
          else
            DEPLOY_ENV="testing"
          fi

          echo "amplify_branch=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"

      - name: Resolve AWS auth method
        id: aws-auth
        shell: bash
        run: |
          if [ -n "${{ secrets.AWS_ROLE_ARN }}" ]; then
            echo "method=oidc" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ secrets.AWS_ACCESS_KEY_ID }}" ] && [ -n "${{ secrets.AWS_SECRET_ACCESS_KEY }}" ]; then
            echo "method=keys" >> "$GITHUB_OUTPUT"
          else
            echo "method=none" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if AWS credentials are missing
        if: steps.aws-auth.outputs.method == 'none'
        run: |
          echo "Missing AWS credentials. Set AWS_ROLE_ARN for OIDC or AWS_ACCESS_KEY_ID/AWS_SECRET_ACCESS_KEY secrets." >&2
          exit 1

      - name: Configure AWS credentials (OIDC)
        if: steps.aws-auth.outputs.method == 'oidc'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure AWS credentials (Access Keys)
        if: steps.aws-auth.outputs.method == 'keys'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Amplify branch environment variables
        run: |
          aws amplify update-branch \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ steps.deploy-context.outputs.amplify_branch }}" \
            --environment-variables "VITE_API_URL=${{ env.BACKEND_API_URL }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Package build output
        run: |
          cd frontend/dist
          zip -r ../../deploy.zip .

      - name: Create Amplify deployment
        id: amplify
        run: |
          read -r JOB_ID UPLOAD_URL <<< "$(aws amplify create-deployment \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ steps.deploy-context.outputs.amplify_branch }}" \
            --region "${{ env.AWS_REGION }}" \
            --query '[jobId,zipUploadUrl]' \
            --output text)"

          echo "job_id=$JOB_ID" >> "$GITHUB_OUTPUT"
          echo "upload_url=$UPLOAD_URL" >> "$GITHUB_OUTPUT"

      - name: Upload artifact to Amplify
        run: |
          curl -X PUT \
            --upload-file deploy.zip \
            -H "Content-Type: application/zip" \
            "${{ steps.amplify.outputs.upload_url }}"

      - name: Start Amplify deployment
        run: |
          aws amplify start-deployment \
            --app-id "${{ env.AMPLIFY_APP_ID }}" \
            --branch-name "${{ steps.deploy-context.outputs.amplify_branch }}" \
            --job-id "${{ steps.amplify.outputs.job_id }}" \
            --region "${{ env.AWS_REGION }}"

      - name: Wait for Amplify deployment
        run: |
          for attempt in {1..90}; do
            STATUS=$(aws amplify get-job \
              --app-id "${{ env.AMPLIFY_APP_ID }}" \
              --branch-name "${{ steps.deploy-context.outputs.amplify_branch }}" \
              --job-id "${{ steps.amplify.outputs.job_id }}" \
              --region "${{ env.AWS_REGION }}" \
              --query 'job.summary.status' \
              --output text)

            echo "Amplify job status: $STATUS"

            if [ "$STATUS" = "SUCCEED" ]; then
              exit 0
            fi

            if [ "$STATUS" = "FAILED" ] || [ "$STATUS" = "CANCELLED" ]; then
              exit 1
            fi

            sleep 10
          done

          echo "Timed out waiting for Amplify deployment." >&2
          exit 1
