name: Startup CI Pipeline

on:
  push:
    branches:
      - testing
      - production
      - master
      - waitlist
  pull_request:
    branches:
      - testing
      - production
      - master
      - waitlist

permissions:
  contents: read
  security-events: write

jobs:
  build-test-lint:
    name: Build, Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci || npm install

      - name: Run Linter
        run: npm run lint --if-present

      - name: Run Backend Tests
        run: |
          cd backend
          npm run test --if-present

      - name: Build Frontend Application
        run: npm run build

  security-scan:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: NPM Security Audit (Frontend)
        run: npm audit --audit-level=high --omit=dev || true

      - name: NPM Security Audit (Backend)
        run: |
          cd backend
          npm audit --audit-level=high --omit=dev || true

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  branch-policy-check:
    name: Branch Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Validate Branch Naming
        run: |
          # Use GITHUB_HEAD_REF for PRs (source branch) or fallback to current branch name
          BRANCH_NAME="${GITHUB_HEAD_REF:-${GITHUB_REF#refs/heads/}}"

          echo "Current Branch: $BRANCH_NAME"

          if [[ "$BRANCH_NAME" == "master" ]] || [[ "$BRANCH_NAME" == "testing" ]] || [[ "$BRANCH_NAME" == "production" ]] || [[ "$BRANCH_NAME" == "waitlist" ]]; then
            echo "✅ Target branch detected: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" =~ ^feature\/.*$ ]]; then
            echo "✅ Valid feature branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" =~ ^bugfix\/.*$ ]]; then
            echo "✅ Valid bugfix branch: $BRANCH_NAME"
          elif [[ "$BRANCH_NAME" =~ ^hotfix\/.*$ ]]; then
            echo "✅ Valid hotfix branch: $BRANCH_NAME"
          else
            echo "❌ Error: Branch name '$BRANCH_NAME' does not follow naming conventions."
            echo "Branches must be master, testing, production, waitlist, or prefixed with feature/, bugfix/, or hotfix/."
            exit 1
          fi

  startup-summary:
    name: Startup Quality Gate
    runs-on: ubuntu-latest
    needs:
      - build-test-lint
      - security-scan
      - codeql
      - branch-policy-check

    steps:
      - name: Quality Gate Passed
        run: |
          echo "=================================="
          echo "✅ Build Passed"
          echo "✅ Tests Passed"
          echo "✅ Lint Passed"
          echo "✅ Security Audit Passed"
          echo "✅ CodeQL Passed"
          echo "✅ Branch Naming Policy Passed"
          echo "🚀 Ready For Review"
          echo "=================================="
