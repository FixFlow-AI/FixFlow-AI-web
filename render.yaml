# render.yaml — FixFlowAI Blueprint (buildX branch)
# ---------------------------------------------------------------------------
# Deploys THREE services from the `buildX` branch:
#   1. fixflowai-ai-service  — Python / FastAPI + Gemini
#   2. fixflowai-backend     — Node / Express + WebSocket /sync
#   3. fixflowai-frontend    — Vite static site (React)
#
# Persistence: seed + in-memory (no external DB required for the demo).
# Payments: simulated by default (ALLOW_PAYMENT_SIMULATION=true). Set real
# RAZORPAY_* secrets + flip that to false to run live payments.
#
# Secrets (sync:false) must be entered in the Render dashboard after the first
# blueprint sync. Values marked generateValue are created by Render.
# ---------------------------------------------------------------------------

services:
  # ---------------------------------------------------------------
  # 1) Python AI service (FastAPI + Gemini) — deploy this first
  # ---------------------------------------------------------------
  - type: web
    name: fixflowai-ai-service
    runtime: python
    branch: buildx
    rootDir: ai-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free                      # use 'starter' for a stable judged demo
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false                 # secret — enter in dashboard
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: CONFIDENCE_THRESHOLD
        value: "75"
      - key: MAX_CORRECTION_CYCLES
        value: "1"
      - key: AI_SERVICE_TOKEN
        generateValue: true         # Render generates a shared secret
      # --- Keep-alive: while awake, ping peers every 10 min so the stack stays
      #     warm (the GitHub Actions cron is what wakes a sleeping service). ---
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      - key: KEEP_ALIVE_TARGETS
        value: "https://fixflowai-backend.onrender.com/api/health,https://fixflowai-frontend.onrender.com/,https://fixflowai.xyz/"

  # ---------------------------------------------------------------
  # 2) TypeScript backend (Express + WebSocket sync + escrow/payments)
  # ---------------------------------------------------------------
  - type: web
    name: fixflowai-backend
    runtime: node
    branch: buildx
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: free                      # 'starter' keeps WebSockets alive (no sleep)
    healthCheckPath: /api/health
    envVars:
      - key: AI_SERVICE_URL
        fromService:
          type: web
          name: fixflowai-ai-service
          property: hostport        # private internal address (host:port)
      - key: PUBLIC_AI_SERVICE_URL
        value: https://fixflowai-ai-service.onrender.com
      - key: AI_SERVICE_TOKEN
        fromService:
          type: web
          name: fixflowai-ai-service
          envVarKey: AI_SERVICE_TOKEN
      - key: JWT_SECRET
        generateValue: true
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false                 # required for Google sign-in
      - key: GITHUB_OAUTH_CLIENT_ID
        sync: false                 # required for freelancer GitHub sign-in
      - key: GITHUB_OAUTH_CLIENT_SECRET
        sync: false
      - key: GITHUB_OAUTH_CALLBACK_URL
        sync: false                 # e.g. https://fixflowai-frontend.onrender.com/
      # --- Persistence: DynamoDB (parity with local; data survives restarts) ---
      - key: PERSISTENCE_PROVIDER
        value: dynamodb
      - key: USER_PROVIDER
        value: dynamodb
      - key: FREELANCER_PROVIDER
        value: dynamodb
      - key: AWS_REGION
        value: ap-south-1
      - key: DDB_TABLE_PREFIX
        value: fixflow
      - key: S3_UPLOAD_BUCKET
        value: fixflowai-uploads-019711413699
      - key: S3_PRESIGN_EXPIRY
        value: "900"
      # Render has no `aws configure` — DynamoDB/S3 need explicit credentials.
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # --- CORS: allow the deployed frontend + your domain (comma separated) ---
      - key: FRONTEND_ORIGINS
        value: https://fixflowai-frontend.onrender.com,https://fixflowai.xyz,https://www.fixflowai.xyz
      # --- Payments (Razorpay) ---
      # Demo default: simulated payments allowed even under NODE_ENV=production.
      # For LIVE payments: set ALLOW_PAYMENT_SIMULATION=false and fill the keys.
      - key: ALLOW_PAYMENT_SIMULATION
        value: "true"
      - key: RAZORPAY_KEY_ID
        sync: false                 # optional — only for live payments
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # --- Email notifications (AWS SES, STORY-36) ---
      # SES_FROM_EMAIL must be a verified SES identity. All emails are no-reply.
      - key: SES_FROM_EMAIL
        value: "FixFlowAI <info@fixflowai.xyz>"
      - key: SES_REPLY_TO
        value: ""                    # no-reply — recipients cannot reply
      - key: EMAIL_ENABLED
        value: "true"
      - key: PLATFORM_URL
        value: "https://fixflowai.xyz"
      # --- Keep-alive: the in-process pinger warms the AI service, this backend
      #     (via RENDER_EXTERNAL_URL), and the frontend origins below every 10
      #     min while the backend is awake. The GitHub Actions cron guarantees
      #     wake-ups even when every service is asleep. ---
      - key: KEEP_ALIVE_FRONTEND_URL
        value: "https://fixflowai-frontend.onrender.com,https://fixflowai.xyz"
      # --- Corsair agent integration layer (BuildX Corsair track) ---
      - key: CORSAIR_ENABLED
        value: "true"
      - key: CORSAIR_KEK
        sync: false
      - key: CORSAIR_PROD_API_KEY
        sync: false
      - key: CORSAIR_PROD_SIGNING_SECRET
        sync: false
      - key: CORSAIR_DEV_API_KEY
        sync: false
      - key: CORSAIR_DEV_SIGNING_SECRET
        sync: false
      # Per-plugin auth mode. Every plugin MUST have an explicit authType or
      # Corsair reports "Plugin '<id>' is not configured". Defaults set in code.
      #   github: managed (Hub-brokered OAuth, zero BYO setup) | oauth_2 | api_key
      #   slack : oauth_2 (needs a BYO Slack OAuth app) | api_key (bot token)
      #   gmail : oauth_2 (needs a BYO Google OAuth app)
      - key: CORSAIR_GITHUB_AUTH
        value: "managed"
      - key: CORSAIR_SLACK_AUTH
        value: "oauth_2"
      - key: CORSAIR_GMAIL_AUTH
        value: "oauth_2"

  # ---------------------------------------------------------------
  # 3) Frontend (Vite React) — static site
  # ---------------------------------------------------------------
  - type: web
    name: fixflowai-frontend
    runtime: static
    branch: buildx
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # NOTE: all VITE_* vars are baked in at BUILD time. After changing any of
      # them, trigger "Clear cache & deploy" so the new value is compiled in.
      #
      # The browser calls the backend directly, so this must be the backend's
      # PUBLIC URL. Enter it after the backend is live, then redeploy the site.
      - key: VITE_API_BASE_URL
        sync: false                 # e.g. https://fixflowai-backend.onrender.com
      # Google OAuth Web Client ID — same value as backend GOOGLE_OAUTH_CLIENT_ID.
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # GitHub OAuth Client ID — same app as backend GITHUB_OAUTH_CLIENT_ID.
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
      # Must equal the GitHub app's callback + backend GITHUB_OAUTH_CALLBACK_URL.
      - key: VITE_GITHUB_REDIRECT_URI
        sync: false                 # e.g. https://fixflowai-frontend.onrender.com/
      # Optional: Razorpay Key ID for client checkout (public rzp_... key).
      - key: VITE_RAZORPAY_KEY_ID
        sync: false
    # The app uses hash routing (#/dashboard), so no SPA rewrite is required.
    # If you switch to path routing later, add:
    # routes:
    #   - type: rewrite
    #     source: /*
    #     destination: /index.html
